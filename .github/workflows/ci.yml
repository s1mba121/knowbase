name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test_publishable
      SUPABASE_SECRET_KEY: test_secret
      OPENAI_API_KEY: sk-test
      REDIS_URL: ''
      INGEST_EMBEDDED_WORKER: 'false'
      FRONTEND_URL: ''
      BACKEND_URL: ''
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test_publishable
      VITE_API_URL: ''
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          # Vite 8 / Tailwind 4: macOS lockfile often omits Linux optional natives
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            *) ARCH=x64 ;;
          esac
          npm install --no-save --legacy-peer-deps -w knowbase-frontend \
            "@rolldown/binding-linux-${ARCH}-gnu@1.2.7" \
            "lightningcss-linux-${ARCH}-gnu@1.32.0" \
            "@tailwindcss/oxide-linux-${ARCH}-gnu@4.3.3"
          npm install --no-save --legacy-peer-deps --prefix ./frontend/node_modules/vite \
            "lightningcss-linux-${ARCH}-gnu@1.33.0"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -Eeuo pipefail

            cd /opt/knowbase

            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo ".env missing on VPS" >&2
              exit 1
            fi

            bash scripts/server-deploy.sh
